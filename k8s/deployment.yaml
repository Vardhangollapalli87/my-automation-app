apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-automation-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-automation-app
  template:
    metadata:
      labels:
        app: my-automation-app
    spec:
      containers:
      - name: my-automation-app
        image: vardhangollapalli/my-automation-app:latest  # your Docker Hub image
        imagePullPolicy: Always
        ports:
        - containerPort: 3000